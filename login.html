<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Barbearia</title>
    <!-- Aqui chamamos o arquivo CSS que vamos criar -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-box">
        <h2>Entrar</h2>
        <!-- O action aponta para o outro arquivo HTML -->
        <form action="barbearia.html" method="GET">
            <input type="text" placeholder="Usuário" required>
            <input type="password" placeholder="Senha" required>
            <button type="submit">Acessar</button>
        </form>
    </div>

</body>
</html>
